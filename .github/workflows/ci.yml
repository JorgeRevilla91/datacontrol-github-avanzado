name: CI Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Actualizar README con la feature
        run: |
          RAMA=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "Añadida feature: $RAMA" >> README.md
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "feat: añadir registro de feature $RAMA al README" || echo "No hay cambios"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          shell: bash
        run: |
          if [ "$DEV_TOKEN" == "$LOCAL_DEV_TOKEN" ]; then
            echo "Validación de DEV_TOKEN exitosa."
          else
            echo "Error: El DEV_TOKEN no coincide con LOCAL_DEV_TOKEN."
            exit 1
          fi
